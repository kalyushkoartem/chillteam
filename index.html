<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chillteam/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla App Template</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    
    <script type="module" crossorigin src="/chillteam/commonHelpers3.js"></script>
    <link rel="stylesheet" href="/chillteam/assets/index-bbaf988c.css">
  </head>
  <body>
    <!-- Loads the specified .html file -->
    <section class="fav">
    <a href="../fav.html">Обране</a>
    <a href="../details.html">Деталі</a>
</section>
    
    <section class="hero">
      <div class="container hero__box">
        <h1 class="hero__title">Досліджуй світ покемонів!</h1>
        <p class="hero__subtitle">
          Знайди, вивчай і збирай своїх улюблених покемонів.
        </p>
      </div>
    </section>
    <section class="search">
  <div class="container search__box">
      <div class="search__input-wrapper">
        <svg class="search__icon search__icon--loupe">
          <use href="/chillteam/assets/symbol-defs-5e08f1e8.svg#search"></use>
        </svg>
        <input
          placeholder="Пошук за ім'ям"
          type="text"
          class="search__input"
        />
      </div>
    <div class="search__dropdown">
      <select class="search__select">
        <option value="all">Усі типи</option>
        <option value="type1">Normal</option>
        <option value="type2">Fire</option>
        <option value="type1">Water</option>
        <option value="type2">Grass</option>
        <option value="type1">Electric</option>
        <option value="type2">Ice</option>
        <option value="type1">Fighting</option>
        <option value="type2">Poison</option>
        <option value="type1">Ground</option>
        <option value="type2">Flying</option>
        <option value="type1">Psychic</option>
        <option value="type2">Bug</option>
        <option value="type1">Rock</option>
        <option value="type2">Ghost</option>
        <option value="type1">Dragon</option>
        <option value="type2">Dark</option>
        <option value="type1">Steel</option>
        <option value="type2">Fairy</option>
      </select>
        <svg class="search__icon search__icon--arrow">
          <use href="/chillteam/assets/symbol-defs-5e08f1e8.svg#chevron-down"></use>
        </svg>
    </div>
     <button class="search__btn">
        <svg class="search__icon search__icon--btn">
          <use href="/chillteam/assets/symbol-defs-5e08f1e8.svg#dice-five"></use>
        </svg>
        Випадковий покемон
      </button>
      <div class="svg-test">

</div>
    <p class="search__text">знайдено:</p>
    <ul class="search__list">

    </ul>
    
    <button class="search__load load-more" type="button">
  Load more
</button>
  </div>
</section>

    <section class="menu">
     <button class="open-modal">Випадковий покемон</button>
    <div class="container">


  <div class="modal">
    <div class="modal__content">

      <button class="modal__close">&times;</button>

      <h2>Випадковий покемон</h2>

      <div class="pokemon">

        <div class="pokemon__image">
          <img class="pokemonimg" src="" alt="Pokemon">
        </div>

        <div class="pokemon__info">

          <p class="pokemon__number">#000</p>

          <h3 class="pokemon__name">Pokemon</h3>

          <div class="pokemon__types"></div>

          <div class="pokemon__details">
            <div>
              <p>Зріст</p>
              <span class="pokemon__height">0 м</span>
            </div>

            <div>
              <p>Вага</p>
              <span class="pokemon__weight">0 кг</span>
            </div>
          </div>

          <h4>Базові характеристики</h4>

          <div class="pokemon__stats"></div>

        </div>

      </div>

      <button class="pokemon__random">
        🎲 Дослідити ще
      </button>

    </div>
  </div>
</div>
</section>

    
  </body>
</html>
