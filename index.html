<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chillteam/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla App Template</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    
    <script type="module" crossorigin src="/chillteam/commonHelpers2.js"></script>
  </head>
  <body>
    <!-- Loads the specified .html file -->
    <section class="fav">
    <a href="../fav.html">Обране</a>
</section>
    
    
    
    
    
    <section class="menu">
    <div class="container">
        <div class="menu__modal">
            <button class="menu__close"></button>
            <h2>Випадковий покемон</h2>
            <div class="pokemon">
                <img class="pokemonimg" src="" alt="">
                <div class="pokemoninfo">
                    <p class="">#094</p>
                    <h1 class="menu__name">Gengar</h1>

                    <span class="menu__typeghost">Ghost</span>
                    <span class="menu__typepoison">Poison</span>

                    <p class="menu__height">Зріст: 1.5 м</p>
                    <p class="">Вага: 40.5 кг</p>

                    <h3 class="">Базові характеристики</h3>

                    <p class="stat">
                        <span>HP</span><span>60</span>
                        <i style="--value: 40%; --color: #ff784e"></i>
                    </p>
                    <p class="stat">
                        <span>Attack</span><span>65</span>
                        <i style="--value: 43%; --color: #ff9c42"></i>
                    </p>
                    <p class="stat">
                        <span>Defense</span><span>60</span>
                        <i style="--value: 40%; --color: #40a8e8"></i>
                    </p>
                    <p class="stat">
                        <span>Sp. Atk</span><span>130</span>
                        <i style="--value: 87%; --color: #3986ff"></i>
                    </p>
                    <p class="stat">
                        <span>Sp. Def</span><span>75</span>
                        <i style="--value: 50%; --color: #8561d5"></i>
                    </p>
                    <p class="stat">
                        <span>Speed</span><span>110</span>
                        <i style="--value: 73%; --color: #8561d5"></i>
                    </p>


                </div>
            </div>
        </div>
    </div>
</section>

    
  </body>
</html>
