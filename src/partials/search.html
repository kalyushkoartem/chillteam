<section class="search">
  <div class="container search__box">
      <div class="search__input-wrapper">
        <svg class="search__icon search__icon--loupe">
          <use href="../img/symbol-defs.svg#search"></use>
        </svg>
        <input
          placeholder="Пошук за ім'ям"
          type="text"
          class="search__input"
        />
      </div>
    <div class="search__dropdown">
      <select class="search__select">
        <option value="all">Усі типи</option>
        <option value="type1">Normal</option>
        <option value="type2">Fire</option>
        <option value="type1">Water</option>
        <option value="type2">Grass</option>
        <option value="type1">Electric</option>
        <option value="type2">Ice</option>
        <option value="type1">Fighting</option>
        <option value="type2">Poison</option>
        <option value="type1">Ground</option>
        <option value="type2">Flying</option>
        <option value="type1">Psychic</option>
        <option value="type2">Bug</option>
        <option value="type1">Rock</option>
        <option value="type2">Ghost</option>
        <option value="type1">Dragon</option>
        <option value="type2">Dark</option>
        <option value="type1">Steel</option>
        <option value="type2">Fairy</option>
      </select>
        <svg class="search__icon search__icon--arrow">
          <use href="../img/symbol-defs.svg#chevron-down"></use>
        </svg>
    </div>
     <button class="search__btn">
        <svg class="search__icon search__icon--btn">
          <use href="../img/symbol-defs.svg#dice-five"></use>
        </svg>
        Випадковий покемон
      </button>
    <p class="search_text">знайдено:</p>
    <ul class="search__list"></ul>
  </div>
</section>
