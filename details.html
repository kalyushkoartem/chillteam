<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <div class="container">
   <a class="details__link" href=""> 
    <svg class="details__icon details__icon--arrow">
    <use href="/chillteam/assets/symbol-defs-44026ddd.svg#arrow-left"></use>
    </svg>До каталогу</a>

        <div class="details__box">
            <div class="details__imgbox">
                <span class="details__pokemonid"></span>
                <img src="" alt="Pokemon" class="details__img">
                <p class="details__genus"></p>
            </div>

            <div class="details__infobox">
                <span class="details__pokemonid"></span>
                <h1 class="details__name"></h1>
                <button class="details__fav" type="button"> 
                    <svg class="details__icon details__icon--arrow">
                    <use href="/chillteam/assets/symbol-defs-44026ddd.svg#heart"></use>
                    </svg>
                </button>
                <div class="details__filtr"></div>
                <p class="details__description"></p>

                <div class="details__height">
                    <h2 class="details__label"> 
                        <svg class="details__icon details__icon--arrow">
                        <use href="/chillteam/assets/symbol-defs-44026ddd.svg#fit-to-height"></use>
                        </svg>
                        Зріст</h2>
                    <p class="details__text"></p>
                </div>

                <div class="details__weight">
                    <h2 class="details__label">
                        <svg class="details__icon details__icon--arrow">
                        <use href="/chillteam/assets/symbol-defs-44026ddd.svg#weight"></use>
                        </svg>
                        Вага</h2>
                    <p class="details__text"></p>
                </div>

                 <div class="details__capability">
                    <h2 class="details__label">
                        <svg class="details__icon details__icon--arrow">
                        <use href="/chillteam/assets/symbol-defs-44026ddd.svg#star"></use>
                        </svg>
                        Здібність</h2>
                    <p class="details__text"></p>
                </div>
            </div>

            <div class="details__stats">
                <h2 class="details__title">Базові характеристики</h2>
                <span class="details__total">Разом: </span>
            </div>

             <div class="stats-list">
        <!-- HP -->
        <div class="stat-row">
            <span class="stat-label">HP</span>
            <span class="stat-value">35</span>
            <div class="progress-container">
                <div class="progress-bar bg-yellow" style="width: 14%;"></div>
            </div>
        </div>
        </div>
</div>
